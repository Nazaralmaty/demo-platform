<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#135685">
<title>GSC Study · кабинет учителя</title>
<link rel="icon" href="assets/brand-logo.png">
<link rel="stylesheet" href="app/style.css">
<link rel="stylesheet" href="app/brand.css">
<link rel="stylesheet" href="app/eco.css">
</head>
<body class="eco">
<main class="e-page" id="root"></main>

<script src="config.js"></script>
<script src="app/course.js"></script>
<script src="app/control.js"></script>
<script src="app/data.js"></script>
<script src="app/eco.js"></script>
<script>
(function () {
  'use strict';
  var C = CTRL, D = DEMO;
  E.shell('teacher');

  var m = /[?&]t=(t\d)/.exec(location.search);
  var S = { teacher: m ? m[1] : 't1' };

  function me() { return D.byId(D.load().teachers, S.teacher); }
  function mine() { return D.load().cards.filter(function (c) { return c.teacher_id === S.teacher; }); }

  /* Галочка: своя у каждого состояния урока. Подтверждённое клиентом или
     разобранное администратором закрыто замком — переписать задним числом
     то, за что уже платят, нельзя. */
  function check(r) {
    var l = r.l;
    if (r.date > D.TODAY) return '<span class="e-check none" aria-hidden="true"></span>';
    if (l.client_answer || l.review) {
      return '<button class="e-check lock" disabled title="Клиент ответил — отметка закрыта" aria-label="Отметка закрыта">' +
        E.ICON.lock + '</button>';
    }
    return '<button class="e-check' + (l.taught ? ' on' : '') + '" data-teach="' + l.id + '" data-on="' + (l.taught ? 0 : 1) +
      '" aria-pressed="' + !!l.taught + '" aria-label="Урок проведён" title="' +
      (l.taught ? 'Снять отметку' : 'Отметить: урок проведён') + '">' + E.ICON.check + '</button>';
  }
  function lessonRow(r) {
    var future = r.date > D.TODAY;
    return '<div class="e-les' + (future ? ' future' : '') + '">' + check(r) +
      '<span class="d"><b>' + E.short(r.date) + '</b>' + E.dayShort(r.date) + '</span>' +
      '<span class="tp">' + E.esc(r.l.topic || 'тема не задана') +
        '<small>' + E.esc(r.l.homework || '') + '</small></span>' +
      (future ? (r.l.course_id ? '<button class="e-btn sm sec" data-mat="' + r.l.id + '">Материал урока</button>' : '')
              : E.chip(r.status)) +
    '</div>';
  }

  function student(an, card) {
    var rows = C.forCard(an, card.id).filter(function (r) { return r.date; })
      .sort(function (a, b) { return a.date.localeCompare(b.date); });
    var lv = D.levelOf(card), next = D.nextLesson(D.load(), card.id);
    var n = next && next.course_id ? +next.course_id.slice(1) : 14;
    var periods = [D.P1, D.P2].map(function (p) {
      var list = rows.filter(function (r) { return r.period.key === p.key && r.date <= C.addDays(D.TODAY, 7); });
      var upcoming = list.filter(function (r) { return r.date > D.TODAY; }).slice(0, 2);
      list = list.filter(function (r) { return r.date <= D.TODAY; }).concat(upcoming);
      if (!list.length) return '';
      return '<div class="e-period">' + C.periodLabel(p, 'ru') + ' · ' + (C.isClosed(p, D.TODAY) ? 'закрыт' : 'идёт') + '</div>' +
        list.map(lessonRow).join('');
    }).join('');
    return '<section class="e-card" id="c-' + card.id + '">' +
      '<div class="e-card-h">' + E.who(card.name, E.dayNames(card.days) + ', ' + card.time_at + ' · ' + card.goal) +
        '<span class="sp"></span>' +
        '<span class="e-tag">' + E.esc(lv ? lv.code + ' ' + lv.title : card.level) + '</span>' +
        '<div class="e-prog" style="min-width:150px"><div class="e-bar" style="height:6px"><i class="wait" style="opacity:1;width:' +
          Math.round((n - 1) / 14 * 100) + '%"></i></div><span>урок ' + n + ' из 14</span></div></div>' +
      (card.note ? '<p class="e-small" style="margin:-4px 0 6px">' + E.esc(card.note) + '</p>' : '') +
      periods + '</section>';
  }

  function today(an) {
    var list = an.rows.filter(function (r) { return r.card.teacher_id === S.teacher && r.date === D.TODAY; });
    var soon = an.rows.filter(function (r) { return r.card.teacher_id === S.teacher && r.date > D.TODAY; })
      .sort(function (a, b) { return a.date.localeCompare(b.date) || a.card.time_at.localeCompare(b.card.time_at); })[0];
    return '<section class="e-card"><div class="e-card-h"><h2>Сегодня, понедельник 19 октября</h2>' +
        '<span class="sub">Урок готов заранее: тема, правило, слова и задания из курса школы.</span></div>' +
      (list.length ? list.map(function (r) {
        var L = D.courseLesson(r.card, +String(r.l.course_id || 'x1').slice(1));
        return '<div class="e-li" style="padding:12px 0">' +
          '<span class="e-who"><span class="e-ava">' + E.esc(r.card.time_at) .slice(0, 2) + '</span><span style="min-width:0"><b>' +
            E.esc(r.card.name) + ' · ' + r.card.time_at + '</b><small>' + E.esc(r.l.topic) + '</small></span></span>' +
          (r.l.taught ? E.chip(r.status) : '') +
          '<div class="e-acts" style="padding-left:49px">' +
            (L ? '<button class="e-btn sm sec" data-mat="' + r.l.id + '">Материал урока</button>' : '') +
            (r.l.taught ? '' : '<button class="e-btn sm ok" data-teach="' + r.l.id + '" data-on="1">' + E.ICON.check + ' Урок проведён</button>') +
          '</div></div>';
      }).join('')
      : '<div class="e-empty">Сегодня уроков нет.' + (soon ? ' Ближайший: ' + E.dayShort(soon.date) + ', ' +
          C.dateLabel(soon.date, 'ru') + ', ' + soon.card.time_at + ' — ' + E.esc(soon.card.name) + '.' : '') + '</div>') +
    '</section>';
  }

  function issues(an) {
    var tk = an.tickets.filter(function (t) { return t.card.teacher_id === S.teacher; });
    if (!tk.length) return '';
    var NOTE = {
      dispute: 'Клиент ответил, что урока не было. Администратор свяжется с вами.',
      suspect: 'Отметку не подтверждал клиент, и она не по графику. Администратор уточнит.',
      ghost: 'Клиент подтвердил урок, а отметки нет. Если урок был — администратор его засчитает.',
      unsure: 'Клиент не уверен, был ли урок. Администратор уточнит у него.',
      lowq: 'Клиент поставил низкую оценку.',
      silent: 'Клиент пока не ответил. Ему ушло напоминание.'
    };
    return '<section class="e-card"><div class="e-card-h"><h2>Вопросы по вашим урокам</h2>' +
        '<span class="e-chip warn plain">' + tk.length + '</span>' +
        '<span class="sub">Эти уроки пока не в выплате. Решает администратор — вам видно то же, что и ему.</span></div>' +
      '<div class="e-tickets">' + tk.map(function (t) {
        var r = t.rows[0];
        return '<div class="e-ticket"><div class="hd">' + E.chip(r.status) + '<span class="sum">' + E.money(t.sum) + '</span></div>' +
          '<div class="nm"><b>' + E.esc(t.card.name) + '</b> ' + (t.kind === 'silent' ? E.plural(t.rows.length, 'урок', 'урока', 'уроков') +
            ' за ' + C.periodLabel(t.period, 'ru') : C.dateLabel(r.date, 'ru') + ' · ' + E.esc(r.l.topic)) + '</div>' +
          (r.l.client_note && t.kind !== 'silent' ? '<div class="e-quote">«' + E.esc(r.l.client_note) + '»</div>' : '') +
          '<p>' + NOTE[t.kind] + '</p></div>';
      }).join('') + '</div></section>';
  }

  function draw() {
    var an = D.analyze(), t = me(), st = D.load();
    var m1 = C.money(C.forPeriod(an, D.P1).filter(function (r) { return r.card.teacher_id === t.id; }));
    var m2 = C.money(C.forPeriod(an, D.P2).filter(function (r) { return r.card.teacher_id === t.id && r.date <= D.TODAY; }));
    return '<div class="e-head"><div><span class="e-eyebrow">Учитель</span><h1>' + E.esc(t.name) + '</h1>' +
        '<p>Отмечаете урок — раз в две недели клиент подтверждает его — зарплата считается сама. ' +
        'Темы, правила, слова и задания уже готовы в курсе школы: составлять урок с нуля не нужно.</p></div>' +
        '<div><div class="e-small" style="margin-bottom:6px">Демо: войти как</div><div class="e-seg">' + st.teachers.map(function (x) {
          return '<button data-t="' + x.id + '"' + (x.id === t.id ? ' class="on"' : '') + '>' + E.esc(x.name.split(' ')[0]) + '</button>';
        }).join('') + '</div></div></div>' +
      '<div class="e-kpis">' +
        '<div class="e-kpi ok"><span>Зарплата · 1–15 окт</span><b>' + E.money(m1.payable) + '</b><small>' +
          E.plural(m1.n.payable, 'урок подтверждён', 'урока подтверждены', 'уроков подтверждены') + '</small></div>' +
        '<div class="e-kpi ' + (m1.review ? 'bad' : '') + '"><span>На проверке</span><b>' + E.money(m1.review) + '</b><small>' +
          (m1.review ? 'ждёт решения администратора' : 'вопросов нет') + '</small></div>' +
        '<div class="e-kpi"><span>16–31 окт · ждёт клиента</span><b>' + E.money(m2.awaiting) + '</b><small>запрос уйдёт 1 ноября</small></div>' +
        '<div class="e-kpi"><span>Ученики</span><b>' + mine().length + '</b><small>ставка ' + E.money(t.rate) + ', у ученика может быть своя</small></div>' +
      '</div>' +
      '<div class="e-grid two aside-first">' +
        '<div class="e-stack">' + mine().map(function (c) { return student(an, c); }).join('') + '</div>' +
        '<div class="e-stack">' + today(an) + issues(an) +
          '<section class="e-card"><div class="e-card-h"><h2>Как считается зарплата</h2></div>' +
          '<dl class="e-dl">' +
            '<div><dt>Отметили урок</dt><dd>заявка</dd></div>' +
            '<div><dt>Клиент подтвердил, оценка 3–5</dt><dd style="color:var(--ok);font-weight:700">к выплате</dd></div>' +
            '<div><dt>Клиент молчит, спор, оценка 1–2</dt><dd>решает администратор</dd></div>' +
            '<div><dt>Выплата</dt><dd>два раза в месяц</dd></div>' +
          '</dl></section>' +
        '</div>' +
      '</div>';
  }

  function material(id) {
    var st = D.load(), l = D.byId(st.lessons, id), card = D.byId(st.cards, l.card_id);
    var L = D.courseLesson(card, +String(l.course_id).slice(1));
    if (!L) return;
    var choice = L.tasks.filter(function (x) { return x.t === 'choice'; }).length;
    E.open('<span class="e-tag">' + E.esc(L.level.code + ' ' + L.level.title) + ' · урок ' + L.n + ' из 14</span>' +
      '<h3 style="margin-top:10px">' + E.esc(L.title) + '</h3><p class="e-small" style="margin:0">' + E.esc(L.subtitle) + '</p>' +
      '<div class="e-rule">' + E.esc(L.rule) + '</div>' +
      (L.examples.length ? '<div class="e-label">Примеры</div><div class="e-small" style="color:var(--ink)">' +
        L.examples.slice(0, 4).map(function (x) { return E.esc(x.en || x) + (x.ru ? ' — <span class="e-muted">' + E.esc(x.ru) + '</span>' : ''); }).join('<br>') + '</div>' : '') +
      '<div class="e-label">Слова урока · ' + L.words.length + '</div><div class="e-words">' + L.words.map(function (w) {
        return '<span>' + E.esc(w.en) + '<i>' + E.esc(w.ru) + '</i></span>';
      }).join('') + '</div>' +
      '<div class="e-label">Задания в платформе</div><p class="e-small" style="margin:0">' + L.tasks.length + ' заданий: ' +
        choice + ' на выбор ответа и ' + (L.tasks.length - choice) + ' на сборку предложения, с разбором ошибок. Плюс видео, чтение и словарь флип-картами.</p>' +
      '<div class="e-label">Домашнее задание · уйдёт в журнал</div><div class="e-rule" style="margin-top:4px">' + E.esc(l.homework) + '</div>' +
      '<div class="foot"><a class="e-btn sec" href="index.html">Открыть платформу ученика</a><button class="e-btn" data-close>Готово</button></div>');
  }

  draw.wire = function (root) {
    E.on(root, '[data-t]', function (b) {
      S.teacher = b.getAttribute('data-t');
      history.replaceState(null, '', '?t=' + S.teacher);
      go();
    });
    E.on(root, '[data-teach]', function (b) {
      var on = b.getAttribute('data-on') === '1';
      var res = D.act.teach(b.getAttribute('data-teach'), on);
      E.toast(res === 'ok' ? (on ? 'Урок отмечен — ждёт подтверждения клиента' : 'Отметка снята') : res);
    });
    E.on(root, '[data-mat]', function (b) { material(b.getAttribute('data-mat')); });
  };
  var go = E.mount(document.getElementById('root'), draw);
})();
</script>
</body>
</html>
