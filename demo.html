<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#135685">
<meta name="description" content="GSC Study · демо: своя платформа для школы английского — курс с видеоуроками, кабинет учителя, дашборд, методика, зарплата, возвраты и гарантии.">
<title>GSC Study · демо системы школы</title>
<link rel="icon" href="assets/brand-logo.png">
<link rel="stylesheet" href="app/style.css">
<link rel="stylesheet" href="app/brand.css">
<link rel="stylesheet" href="app/eco.css">
</head>
<body class="eco">
<main class="e-page" id="root"></main>

<script src="config.js"></script>
<script src="app/course.js"></script>
<script src="app/control.js"></script>
<script src="app/school.js"></script>
<script src="app/data.js"></script>
<script src="app/eco.js"></script>
<script>
(function () {
  'use strict';
  var C = CTRL, D = DEMO, B = window.BRAND || {};
  E.shell('');

  var PAINS = [
    ['«Своей платформы нет — всё в WhatsApp и PDF»', 'Платформа ученика', 'index.html',
     '56 уроков на 4 уровня: видеоуроки-мультфильмы, задания, тексты, словарь и игры. На телефоне, на казахском и русском.'],
    ['«Не знаю, что учитель делает с учеником»', 'Единый дашборд', 'dashboard.html',
     'Уровень, урок курса, старт, график и оплата каждого ученика — одной строкой, по всем учителям.'],
    ['«Каждый учитель учит по-своему»', 'Единая методика', 'metodika.html',
     'Один формат: видео до урока, урок по курсу, домашка в платформе после. Отступления видны сразу.'],
    ['«Каждый урок готовят с нуля»', 'Готовые уроки курса', 'teacher.html',
     'Правило, слова, задания и домашка уже лежат в журнале учителя. И видно, кто из учеников подготовился.'],
    ['«Зарплату считаем в Excel»', 'Ведомость считается сама', 'proverka.html',
     'К выплате — только подтверждённые уроки, по ставке каждого ученика. Два раза в месяц.'],
    ['«Учитель может приписать уроки»', 'Клиент подтверждает уроки', 'confirm.html',
     'Раз в две недели — ссылка в WhatsApp. Спор, «не уверен», лишняя отметка — сразу администратору.'],
    ['«Через неделю просят вернуть всю сумму»', 'Возврат по акту', 'student.html?s=s5#act',
     'Доступ к платформе и проведённые уроки — уже оказанная услуга. Акт из журнала: что клиент получил, по датам.'],
    ['«Обещали результат, а ученик не учился»', 'Гарантия по фактам', 'guarantee.html',
     'Посещаемость, домашка и результат — из журнала. Справка для клиента в один клик.']
  ];
  var STEPS = [
    ['Обзор: вся школа одной таблицей', 'Кто у кого учится, на каком уроке курса, кто просрочил оплату, кто просит возврат.', 'dashboard.html'],
    ['Методика: один формат для всех', 'Кто учит по курсу, кто готовится к уроку и делает домашку. Тимур — пять уроков подряд без домашки.', 'metodika.html'],
    ['Учитель: урок готов, видно, кто готовился', 'Сегодня у Аяжан урок 6 — она уже посмотрела видео. После занятия — «Урок проведён».', 'teacher.html'],
    ['Клиент: подтверждает уроки по ссылке', 'Тимур молчит три дня. Откройте его ссылку и ответьте, например, «не было» на один урок.', 'confirm.html?t=gsc-s2-' + D.P1.key],
    ['Администратор: разбирает расхождения', 'Ответ Тимура уже в очереди. Решите спор — и посмотрите, как меняется ведомость.', 'proverka.html'],
    ['Возврат: мама Аружан просит всё', 'Пакет за 120 000 ₸, через две недели — «верните всю сумму». Акт из журнала: вход, видео, подтверждённые уроки.', 'student.html?s=s5#act'],
    ['Гарантия: обещали IELTS, а домашки нет', 'Нажмите на Тимура — справка: условия из оферты и факт по журналу. Спорить не о чем.', 'guarantee.html'],
    ['Оповещения: что ушло в WhatsApp и Telegram', 'Те же события глазами клиента и администратора.', 'notifications.html']
  ];
  var LIB = (function () {
    var r = { lessons: 0, videos: 0 }, V = window.VIDEOS || {};
    ((window.COURSE || {}).levels || []).forEach(function (lv) {
      lv.lessons.forEach(function (l) { r.lessons++; r.videos += (V[l.id] || []).filter(Boolean).length; });
    });
    return r;
  })();
  function draw() {
    var an = D.analyze(), st = D.load(), m1 = C.money(C.forPeriod(an, D.P1)), F = D.allFacts();
    var kept = 0, asked = 0;
    st.refunds.forEach(function (q) {
      if (q.status !== 'open') return;
      var r = SCHOOL.refund(F.filter(function (f) { return f.card.id === q.card_id; })[0], st.policy);
      kept += r.retained; asked += r.paid;
    });
    var good = F.filter(function (f) { return SCHOOL.verdict(f)[1] === 'ok'; }).length;
    return '<section class="h-hero"><div>' +
        '<span class="e-eyebrow">Демо для ' + E.esc(B.name) + '</span>' +
        '<h1>Своя платформа для школы — <em>целиком</em></h1>' +
        '<p>Для школы английского, у которой своей платформы нет. Курс из ' + LIB.lessons + ' готовых уроков с видеоуроками-мультфильмами, ' +
        'заданиями и словарём — у ученика. Готовые уроки и журнал — у учителя. Дашборд, единая методика, зарплата, ' +
        'возвраты и гарантии — у владельца. Всё в одной системе с постоянной базой данных, а не в чатах и таблицах.</p>' +
        '<div class="e-acts"><a class="e-btn" href="#tour">Пройти демо ' + E.ICON.arrow + '</a>' +
          '<a class="e-btn sec" href="index.html">Платформа ученика</a></div></div>' +
      '<div class="h-board" aria-live="polite"><span class="h-cap">Сейчас в демо-школе</span>' +
        '<div class="h-row"><span>Ученики · учителя</span><b>' + st.cards.length + ' · ' + st.teachers.length + '</b></div>' +
        '<div class="h-row"><span>Готовых уроков · видеоуроков</span><b>' + LIB.lessons + ' · ' + LIB.videos + '</b></div>' +
        '<div class="h-row"><span>Учатся по методике</span><b>' + good + ' из ' + F.length + '</b></div>' +
        '<div class="h-row"><span>К выплате: подтверждено клиентами</span><b>' + E.money(m1.payable) + '</b></div>' +
        '<div class="h-row hot"><span>Не выплачивается до проверки</span><b>' + E.money(m1.review) + '</b></div>' +
        (asked ? '<div class="h-row hot"><span>Просят вернуть ' + E.money(asked) + ', у школы по акту остаётся</span><b>' + E.money(kept) + '</b></div>' : '') +
        '<span class="e-small" style="color:inherit;opacity:.75">Живые цифры: меняются, когда вы нажимаете в демо.</span>' +
      '</div></section>' +
      '<h2 class="h-sect">Восемь болей школы — и что с ними делает система</h2>' +
      '<div class="h-pains">' + PAINS.map(function (p) {
        return '<a class="h-pain" href="' + p[2] + '"><span class="pn">' + E.esc(p[0]) + '</span><b>' + E.esc(p[1]) + '</b>' +
          '<span>' + E.esc(p[3]) + '</span><span class="go">Открыть →</span></a>';
      }).join('') + '</div>' +
      '<h2 class="h-sect" id="tour">Сценарий показа · ' + STEPS.length + ' шагов</h2>' +
      '<div class="h-steps">' + STEPS.map(function (s) {
        return '<a class="h-step" href="' + s[2] + '"><span><b>' + E.esc(s[0]) + '</b><span>' + E.esc(s[1]) + '</span></span>' +
          '<span class="go">Открыть →</span></a>';
      }).join('') + '</div>' +
      '<section class="e-card" style="margin-top:28px"><div class="e-card-h"><h2>Как это устроено</h2></div>' +
        '<dl class="e-dl">' +
          '<div><dt>Клиент вошёл в платформу</dt><dd>оферта принята, доступ — оказанная услуга</dd></div>' +
          '<div><dt>Ученик посмотрел видео, сделал задания</dt><dd>записано с датой и временем</dd></div>' +
          '<div><dt>Учитель отметил урок</dt><dd>заявка, ещё не деньги</dd></div>' +
          '<div><dt>Клиент подтвердил по ссылке, оценка 3–5</dt><dd style="color:var(--ok);font-weight:700">в зарплату — само</dd></div>' +
          '<div><dt>«Не было», «не уверен», оценка 1–2, молчание</dt><dd>решает администратор</dd></div>' +
          '<div><dt>Урок вне программы, домашки нет</dt><dd>отступление от методики</dd></div>' +
          '<div><dt>Просят вернуть деньги</dt><dd>акт: доступ ' + E.money(st.policy.platform_fee) + ' + уроки</dd></div>' +
        '</dl>' +
        '<p class="e-small" style="margin:14px 0 0">Это демо на выдуманных учениках. Всё, что вы нажимаете, хранится только в этом ' +
          'браузере, кнопка «Сбросить» вверху возвращает исходное состояние. В рабочей версии — постоянная база данных школы, ' +
          'вход по номеру телефона и рассылка через WhatsApp школы.</p>' +
        '<div class="e-acts" style="margin-top:16px">' +
          (window.waHref ? '<a class="e-btn wa" href="' + E.esc(waHref()) + '" target="_blank" rel="noopener">' + E.ICON.wa + ' Хочу так же в своей школе</a>' : '') +
        '</div></section>';
  }
  E.mount(document.getElementById('root'), draw);
})();
</script>
</body>
</html>
