      var done = doneOf(c), all = (c.lessons || []).length;
      return '<div class="cardbox" id="cb' + k + '">' +
        '<div class="cb-head"><b>' + (c.teacher_id ? esc(teacherName(d, c.teacher_id)) : 'Без учителя') + '</b>' +
          '<span>проведено ' + done + ' из ' + all + ' · месяцев ' + (c.months || 1) +
          ' по ' + (c.per_month || 12) + ' уроков</span></div>' +
        cardFields(d, 'c' + k, true, c) +
        (done && c.teacher_id ? '<div class="d-hint" style="margin:10px 0 0">Сменить учителя: проведённые уроки ' +

      '<div class="d-form">' +
        '<div><label>Имя *</label><input id="edName" type="text" maxlength="40" value="' + esc(st.name || '') + '"></div>' +

      '</div>' +

      '<div class="d-sec">График и учитель</div>' +
      live.map(cardBox).join('') +
      /* Новая карточка. Если карточки нет — это главное действие окна;
         если есть — вторая (группа плюс индивидуально) под раскрывашкой,
         чтобы не путать с правкой первой. */
      (live.length ? '<details class="more"><summary>Ещё одна карточка — например, группа и индивидуально</summary>' : '') +

              (c.format === 'group' ? 'группа' : 'индивидуально') + ' · проведено ' + doneOf(c) +
              ' из ' + (c.lessons || []).length +
              ' <button class="ed" data-back="' + esc(c.id) + '">Вернуть в работу</button></div>';

        : '') +

      '<div class="dlg-foot" style="border-top:1px solid var(--line);padding-top:14px">' +
        '<button id="edClose">Закрыть</button></div>';

    function v(x) { var el = dlgBody.querySelector('#' + x); return el ? el.value.trim() : ''; }
    function say(where, text, bad) {
      var el = dlgBody.querySelector('#' + where);
      if (el) { el.className = 'state ' + (bad ? 'bad' : 'ok'); el.textContent = text; }
    }
    /* После любой записи — свежие данные и окно заново, уже по ним. */
    function reopen() { return pull().then(function () { editStudent(st.id); }); }

    dlgBody.querySelector('#edClose').onclick = function () { dlg.close(); };

    /* Накладки в графике переспрашивают: первое нажатие показывает, что не
       так, второе сохраняет как есть — админ может знать больше сетки. */
    function confirmed(btn, clash, where) {
      /* подтверждают именно эту накладку: поменял время — спросим снова */
      if (!clash.length || btn.getAttribute('data-sure') === clash.join('|')) return true;
      btn.setAttribute('data-sure', clash.join('|'));
      btn.textContent = 'Сохранить с накладкой';
      say(where, 'В графике накладка — она подсвечена выше. Нажмите ещё раз, если так и задумано.', true);
      return false;
    }

    live.forEach(function (c, k) {
      var box = dlgBody.querySelector('#cb' + k), p = 'c' + k;
      var clashNow = wireFit(d, box, p, c.id);

      box.querySelector('[data-save]').onclick = function () {
        var btn = this;
        if (!confirmed(btn, clashNow(), p + 'State')) return;
        var body = cardBody(v, p, box);
        btn.disabled = true; say(p + 'State', 'Сохраняю…');
        /* Смена учителя при проведённых уроках — перенос, иначе правка на месте. */
        var job = (c.teacher_id && body.teacher_id !== c.teacher_id && doneOf(c))
          ? moveCard(c, body)
          : DB.rest('en_teacher_students?id=eq.' + encodeURIComponent(c.id), {
              method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: body });
        job.then(reopen).catch(function (e) { btn.disabled = false; say(p + 'State', e.message, true); });
      };

      box.querySelector('[data-arch]').onclick = function () {
        var btn = this;
        if (!btn.getAttribute('data-sure')) {
          btn.setAttribute('data-sure', '1'); btn.textContent = 'Точно в архив?';
          say(p + 'State', 'Карточка уйдёт с доски учителя, окна в графике освободятся. Уроки и зарплата по ним сохранятся.', true);
          return;
        }
        btn.disabled = true;
        DB.rest('en_teacher_students?id=eq.' + encodeURIComponent(c.id), {
          method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { archived: true }
        }).then(reopen).catch(function (e) { btn.disabled = false; say(p + 'State', e.message, true); });
      };

      /* Ещё один месяц той же длины, как «+ месяц» в кабинете учителя. */
      box.querySelector('[data-month]').onclick = function () {
        var btn = this, next = (c.months || 1) + 1, per = c.per_month || 12, plan = [];
        for (var i = 1; i <= per; i++) plan.push({ card_id: c.id, month: next, idx: i });
        btn.disabled = true; say(p + 'State', 'Добавляю месяц…');
        DB.rest('en_teacher_lessons', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: plan })
          .then(function () {
            return DB.rest('en_teacher_students?id=eq.' + encodeURIComponent(c.id), {
              method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { months: next } });
          }).then(reopen).catch(function (e) { btn.disabled = false; say(p + 'State', e.message, true); });
      };
    });

    Array.prototype.forEach.call(dlgBody.querySelectorAll('[data-back]'), function (b) {
      b.onclick = function () {
        b.disabled = true;
        DB.rest('en_teacher_students?id=eq.' + encodeURIComponent(b.getAttribute('data-back')), {
          method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { archived: false }
        }).then(reopen).catch(function (e) { b.disabled = false; alert(e.message); });
      };

    dlgBody.querySelector('#edSave').onclick = function () {

      if (!DB.normPhone(phone)) { say('edState', 'Проверьте номер: нужен казахстанский, 11 цифр', true); return; }
      btn.disabled = true; say('edState', 'Сохраняю…');
      DB.rpc('en_edit_student', { p_id: st.id, p_name: name, p_phone: phone, p_level: v('edLevel') || null })
        .then(function (answer) {

            /* сразу в памяти, чтобы кнопка «Поставить к учителю» взяла новое имя и номер */
            st.name = name; st.phone = DB.normPhone(phone); st.level = v('edLevel') || null;
            pull();
          }
        })
        .catch(function (e) { say('edState', e.message, true); })
        .then(function () { btn.disabled = false; });
    };

    var assign = dlgBody.querySelector('#edAssign');
    var edBox = dlgBody.querySelector('#edCardBox');
    var edClash = edBox ? wireFit(d, edBox, 'ed', null) : null;
    if (assign) assign.onclick = function () {
      var btn = this;
      if (!v('edTeacher') && !checkedDays(edBox).length) {
        say('edCardState', 'Отметьте дни занятий или выберите учителя', true); return;
      }
      /* К тому же учителю (или второй раз без учителя) не заводим: это
         дубль, а не второй формат — он правится в карточке выше. */
      if (cardsOf(st, lastData).some(function (c) { return !c.archived && (c.teacher_id || '') === v('edTeacher'); })) {
        say('edCardState', v('edTeacher') ? 'У этого учителя ученик уже есть — правьте его карточку выше'
                                          : 'Карточка без учителя уже есть — правьте её выше', true); return;
      }
      if (!confirmed(btn, edClash(), 'edCardState')) return;
      btn.disabled = true; say('edCardState', 'Ставлю к учителю…');
      addCard(v, st.name || 'Без имени', st.phone, edBox, 'ed')
        .then(reopen)
        .catch(function (e) { btn.disabled = false; say('edCardState', e.message, true); });
    };

    if (!dlg.open) dlg.showModal();
  }

  /* Поля карточки из формы — ровно то, что пишется PATCH-ем. */
  function cardBody(v, p, scope) {
    var age = Number(v(p + 'Age')) || null;
    if (age != null && (age < 3 || age > 99)) age = null;
    return Object.assign({
      teacher_id: v(p + 'Teacher') || null, format: v(p + 'Format') || 'individual',
      days: checkedDays(scope).join(','), time_at: v(p + 'Time') || null,
      age: age, city: v(p + 'City') || null, level: v(p + 'LvlText') || null,
      rate: v(p + 'Rate') === '' ? null : Math.max(0, Number(v(p + 'Rate')) || 0),
      started_on: v(p + 'Start') || null,
      goal: v(p + 'Goal') || null, note: v(p + 'Note') || null
    }, payOf(v, p));
  }
  /* Поля оплаты — только если в базе есть их колонки, иначе PostgREST
     отклонит всю запись из-за одного незнакомого поля. */
  function payOf(v, p) {
    if (!controlOn(lastData)) return {};
    return { pay_plan: v(p + 'Pay') || null, paid_until: v(p + 'Paid') || null };
  }

  /* Смена учителя, когда уроки уже шли. Проведённые уроки держат зарплату
     прежнего учителя, поэтому карточку не перевешиваем, а делим: прежняя
     уходит в архив со своими проведёнными, новая получает непроведённые
     (с темами, домашкой и датами). Колонку card_id у урока из браузера
     не поменять — уроки переезжают вставкой и удалением.

     Порядок — чтобы сбой на любом шаге не терял план: сначала новая
     карточка и её уроки (не легли — новая карточка удаляется), и только
     потом удаление старых непроведённых и архив. */
  function moveCard(c, body) {
    var fresh;
    /* Переезжают только нетронутые уроки: не отмеченные учителем, без
       ответа клиента и без решения админа. Урок, который ждёт клиента,
       остаётся у того, кто его провёл. До патча контроля колонок taught
       нет — тогда, как раньше, по done. */
    return DB.rest('en_teacher_lessons?card_id=eq.' + encodeURIComponent(c.id) +
                   (controlOn(lastData) ? '&taught=is.false&client_answer=is.null&review=is.null' : '&done=is.false') +
                   '&select=id,month,idx,topic,homework,plan_date')
      .then(function (rest) {
        fresh = rest || [];
        return DB.rest('en_teacher_students', {
          method: 'POST', headers: { Prefer: 'return=representation' },
          body: Object.assign({}, body, { name: c.name, phone: c.phone,
                                          months: c.months || 1, per_month: c.per_month || 12 })
        });
      }).then(function (rows) {
        var id = rows[0].id;
        if (!fresh.length) return;
        return DB.rest('en_teacher_lessons', {
          method: 'POST', headers: { Prefer: 'return=minimal' },
          body: fresh.map(function (l) {
            return { card_id: id, month: l.month, idx: l.idx, topic: l.topic,
                     homework: l.homework, plan_date: l.plan_date };
          })
        }).catch(function (e) {
          return DB.rest('en_teacher_students?id=eq.' + encodeURIComponent(id), {
            method: 'DELETE', headers: { Prefer: 'return=minimal' }
          }).catch(function () {}).then(function () { throw e; });
        });
      }).then(function () {
        if (!fresh.length) return;
        return DB.rest('en_teacher_lessons?id=in.(' + fresh.map(function (l) {
          return encodeURIComponent(l.id); }).join(',') + ')', {
          method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      }).then(function () {
        return DB.rest('en_teacher_students?id=eq.' + encodeURIComponent(c.id), {
          method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { archived: true } });
      });
  }

  /* ── сброс кода ───────────────────────────────────────────────────── */
  function resetCode(phone) {
    var code = prompt('Новый код из шести цифр для ' + phoneFmt(phone) + ':', '');
    if (!code) return;
    DB.resetCode(phone, code.trim()).then(function (answer) {
      alert(answer);
      pull();
    }).catch(function (e) { alert(e.message); });
  }

  /* Обновление раз в 10 секунд вместо подписки на изменения: для десятков
     учеников разницы не видно, а websocket и переподключения не нужны.
     Вкладка в фоне не опрашивает — это лишние запросы в бесплатный тариф. */
  function start() {
    pull();
    stop();
    timer = setInterval(function () { if (!document.hidden) pull(); }, 10000);
  }
  function stop() { if (timer) clearInterval(timer); timer = null; }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && timer) pull(); });

  /* ── тестовый режим ───────────────────────────────────────────────
     dashboard.html?demo=1 — весь дашборд на выдуманных данных: ни базы,
     ни входа. Нужен, чтобы посмотреть и покликать, пока патч схемы не
     применён. Правки живут в памяти вкладки и пропадают с обновлением:
     ни одна строка никуда не уходит. Кабинет учителя устроен так же —
     teacher.html?demo=1. */
  function demo() {
    /* Уроки по графику ученика: прошлая половина месяца закрыта и
       подтверждена клиентами (с расхождениями), текущая — отмечена и ждёт.
       scene: дата → ответ клиента, по ней видно каждый тип вопроса. */
    var today = C.day(new Date()), P1 = C.lastClosed(today);
    function les(tag, days, scene, extra) {
      var out = [], d = P1.from, k = 0;
      while (d < C.addDays(today, 10) && k < 24) {
        if (days.indexOf(C.weekday(d)) >= 0) {
          var past = d < today, inP1 = C.inPeriod(d, P1), sc = (scene || {})[k] || {};

                    'Семья', 'Еда', 'Город', 'Past Simple'][k % 8], plan_date: d,
                    taught: past && !sc.notTaught, taught_on: past && !sc.notTaught ? d : null,
                    taught_at: past && !sc.notTaught ? d + 'T19:10:00+05:00' : null,
                    client_answer: inP1 && !(scene || {}).silent ? (sc.a || 'yes') : null,
                    client_quality: inP1 && !(scene || {}).silent && (sc.a || 'yes') === 'yes' ? (sc.q || 5) : null,
                    client_note: sc.note || null, review: null };
          out.push(l); k++;

          format: 'individual', days: 'thu', time_at: '20:00', archived: false,
          rate: 2000, months: 1, per_month: 12, pay_plan: 'lessons8', paid_until: C.addDays(today, 2),
          lessons: les('c', ['thu'], { 1: { a: 'unsure', note: 'Не помню, был ли урок — уезжали.' } }, [sat]) },
        { id: 'c4', teacher_id: 't2', name: 'Әсем', phone: '77013332211', age: 12, city: 'Алматы',
          format: 'group', days: 'sat', time_at: '11:00', archived: false,
          rate: null, months: 1, per_month: 12, pay_plan: 'month', paid_until: C.addDays(today, 20),
          lessons: les('d', ['sat'], { 0: { a: 'yes', notTaught: true }, 1: { a: 'yes', q: 2, note: 'Полурока шумно, плохо слышно.' } }) }
      ]
    };
    data.requests = [req('c1', true), req('c2', false), req('c3', true), req('c4', true)];

    DB.init = function () { return true; };
    DB.userId = 'admin';
    DB.signOut = function () { location.search = ''; };
    DB.listAll = function () { return Promise.resolve(data); };
    DB.allowed = {
      list: function () { return Promise.resolve([]); },
      add:  function () { return Promise.resolve(); },
      remove: function () { return Promise.resolve(); }
    };
    /* Всё, что дашборд пишет в карточки, уроки и графики, ложится в
       память вкладки тем же путём, каким ушло бы в PostgREST: видно, как
       ученик уходит из «без учителя», как карточка переезжает к другому
       учителю и как растёт сетка. Понимает ровно те запросы, что шлёт
       дашборд: POST, PATCH и DELETE по id=eq. / id=in., GET уроков. */
    var seq = 0;
    function lessonsAll() {
      var out = [];
      data.cards.forEach(function (c) { (c.lessons || []).forEach(function (l) { l.card_id = c.id; out.push(l); }); });
      return out;
    }
    function match(q) {
      var m = /[?&]id=eq\.([^&]+)/.exec(q), n = /[?&]id=in\.\(([^)]*)\)/.exec(q);
      if (m) { var one = decodeURIComponent(m[1]); return function (x) { return x.id === one; }; }
      if (n) { var many = n[1].split(',').map(decodeURIComponent); return function (x) { return many.indexOf(x.id) >= 0; }; }
      return function () { return false; };
    }
    DB.rest = function (path, opt) {
      opt = opt || {};
      var table = path.split('?')[0], q = path.slice(table.length), how = opt.method || 'GET';
      var list = table === 'en_teacher_students' ? data.cards
               : table === 'en_teachers' ? data.teachers
               : table === 'en_confirm_requests' ? data.requests : null;
      if (table === 'en_teacher_lessons') {
        if (how === 'POST') {
          var rows = [].concat(opt.body);
          var dup = rows.some(function (l) {
            return lessonsAll().some(function (x) { return x.card_id === l.card_id && x.month === l.month && x.idx === l.idx; });
          });
          if (dup) return Promise.reject(new Error('duplicate key value violates unique constraint'));
          rows.forEach(function (l) {
            var c = data.cards.filter(function (x) { return x.id === l.card_id; })[0];
            if (c) (c.lessons = c.lessons || []).push(Object.assign({ id: 'l' + (++seq), done: false, done_at: null }, l));
          });
          return Promise.resolve([]);
        }
        if (how === 'DELETE') {
          var gone = match(q);
          data.cards.forEach(function (c) { c.lessons = (c.lessons || []).filter(function (l) { return !gone(l); }); });
          return Promise.resolve([]);
        }
        var card = (/card_id=eq\.([^&]+)/.exec(q) || [])[1];
        return Promise.resolve(lessonsAll().filter(function (l) {
          return (!card || l.card_id === decodeURIComponent(card)) && (q.indexOf('done=is.false') < 0 || !l.done);
        }));
      }
      if (!list) return Promise.resolve([]);
      if (how === 'POST') {
        var row = Object.assign({ id: 'new' + (++seq), archived: false, lessons: [] }, opt.body);
        list.push(row);
        return Promise.resolve([row]);
      }
      var hit = match(q);
      if (how === 'PATCH') list.forEach(function (x) { if (hit(x)) Object.assign(x, opt.body); });
      if (how === 'DELETE') for (var i = list.length - 1; i >= 0; i--) if (hit(list[i])) list.splice(i, 1);
      return Promise.resolve([]);
    };
    DB.rpc = function (name, body) {
      /* Решения админа и запросы — по тем же правилам, что функции в базе. */
      if (name === 'en_control_resolve') {
        lessonsAll().forEach(function (l) {
          if (body.p_ids.indexOf(l.id) < 0) return;
          l.review = body.p_how === 'reopen' ? null : body.p_how;
          if (body.p_how === 'paid' && !l.taught) { l.taught = true; l.taught_on = l.plan_date || C.day(new Date()); }
          l.done = C.payable(l); l.done_at = l.done ? new Date().toISOString() : null;
        });
        return Promise.resolve('Готово');
      }
      if (name === 'en_confirm_open') {
        var made = 0;
        data.cards.forEach(function (c) {
          if (c.archived || !c.teacher_id) return;
          if (data.requests.some(function (r) { return r.card_id === c.id && r.period_from === body.p_from; })) return;
          if (!(c.lessons || []).some(function (l) { return C.inPeriod(C.dateOf(l), C.period(body.p_from)); })) return;
          data.requests.push({ id: 'r' + (++seq), token: 'demo' + seq, card_id: c.id, period_from: body.p_from,
                               period_to: body.p_to, created_at: new Date().toISOString() });
          made++;
        });
        return Promise.resolve(made);
      }
      if (name === 'en_edit_student') {
        var st = data.students.filter(function (x) { return x.id === body.p_id; })[0];
        var ph = DB.normPhone(body.p_phone);
        if (st) {
          data.cards.forEach(function (c) { if (c.phone === st.phone) c.phone = ph; });
          st.name = body.p_name; st.phone = ph; st.level = body.p_level;
        }
        return Promise.resolve('Готово: тестовый режим, в базу ничего не ушло');
      }
      return Promise.resolve('Готово');
    };
    DB.addStudent = function () { return Promise.resolve('Готово: тестовый режим, в базу ничего не ушло'); };
    DB.resetCode  = function () { return Promise.resolve('Готово: тестовый режим'); };
    start();
  }

  if (/demo=/.test(typeof location === 'undefined' ? '' : location.search)) demo();
  else if (DB.init()) start();
  else auth('');
})();
</script>
