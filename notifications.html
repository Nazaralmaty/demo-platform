<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#135685">
<title>GSC Study · оповещения</title>
<link rel="icon" href="assets/brand-logo.png">
<link rel="stylesheet" href="app/style.css">
<link rel="stylesheet" href="app/brand.css">
<link rel="stylesheet" href="app/eco.css">
<style>
  .n-rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:900px){ .n-rules{grid-template-columns:minmax(0,1fr)} }
  .n-rule{background:var(--card);border:1.5px solid var(--edge);border-radius:var(--e-r);padding:18px;display:grid;gap:6px;align-content:start}
  .n-rule .when{font-family:var(--head);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
  .n-rule b{font-family:var(--head);font-size:17px;font-weight:800;letter-spacing:-.02em}
  .n-rule p{margin:0;font-size:14px;color:var(--muted)}
  .n-rule .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .n-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .n-pick button{border:1.5px solid var(--edge);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .n-pick button.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
  .n-pick button i{font-style:normal;color:var(--accent);margin-left:4px}
  .n-pick button.on i{color:#fff}
  .n-cap{font-family:var(--head);font-weight:800;font-size:15px;margin:0 0 10px;text-align:center}
  .n-cap small{display:block;font-family:'Golos Text',sans-serif;font-weight:500;color:var(--muted);font-size:13px}
</style>
</head>
<body class="eco">
<main class="e-page" id="root"></main>

<script src="config.js"></script>
<script src="app/course.js"></script>
<script src="app/control.js"></script>
<script src="app/school.js"></script>
<script src="app/data.js"></script>
<script src="app/eco.js"></script>
<script>
(function () {
  'use strict';
  var C = CTRL, D = DEMO, B = window.BRAND || {};
  E.shell('alerts');
  var m = /[?&]student=(s\d+)/.exec(location.search);
  var S = { student: m ? m[1] : 's2' };

  /* Ссылки в сообщении — кликабельные: в демо они ведут на экран клиента. */
  function linkify(text) {
    return E.esc(text).replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      var href = u.replace(/&amp;/g, '&');
      var local = /confirm\.html\?t=([^&\s]+)/.exec(href);
      return '<a href="' + (local ? 'confirm.html?t=' + local[1] : href) + '">' + u + '</a>';
    });
  }
  function dayKey(ts) { return C.day(ts); }

  function whatsapp(st) {
    var card = D.byId(st.cards, S.student);
    var msgs = st.messages.filter(function (x) { return x.card_id === card.id && x.to === 'client'; });
    var reqs = st.requests.filter(function (r) { return r.card_id === card.id && r.answered_at; });
    /* Ответ клиента по ссылке — его «сообщение» в чате. */
    var items = msgs.map(function (x) { return { at: x.at, me: false, html: linkify(x.text) }; })
      .concat(reqs.map(function (r) {
        return { at: r.answered_at, me: true, html: '✓ Ответил по ссылке за ' + C.periodLabel(C.periodByKey(r.period_key), 'ru') };
      }))
      .sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); });
    var last = null;
    return '<div class="e-phone"><div class="scr"><div class="ph-bar"><span class="av"><img src="' + E.esc(B.logo) + '" alt=""></span>' +
      '<span><b>' + E.esc(B.name) + '</b><small>WhatsApp · ' + E.esc(card.name) + ', ' + E.esc(E.phoneFmt(card.phone)) + '</small></span></div>' +
      '<div class="feed" id="waFeed">' + (items.length ? items.map(function (x) {
        var day = dayKey(x.at), head = day !== last ? '<span class="day">' + C.dateLabel(day, 'ru') + '</span>' : '';
        last = day;
        return head + '<div class="e-bub' + (x.me ? ' me' : '') + '">' + x.html + '<span class="tm">' + E.time(x.at) + '</span></div>';
      }).join('') : '<span class="day">Сообщений пока нет</span>') +
      '</div></div></div>';
  }

  function telegram(st) {
    var msgs = st.messages.filter(function (x) { return x.to === 'admin'; })
      .slice().sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); });
    var last = null;
    return '<div class="e-phone tg"><div class="scr"><div class="ph-bar"><span class="av" style="background:#B1005A;color:#fff;font-weight:800">!</span>' +
      '<span><b>' + E.esc(B.name) + ' · контроль</b><small>Telegram-бот администратора</small></span></div>' +
      '<div class="feed" id="tgFeed">' + msgs.map(function (x) {
        var day = dayKey(x.at), head = day !== last ? '<span class="day">' + C.dateLabel(day, 'ru') + '</span>' : '';
        last = day;
        return head + '<div class="e-bub"><b>Расхождение</b><br>' + E.esc(x.text) +
          '<br><a href="proverka.html">Открыть очередь →</a><span class="tm">' + E.time(x.at) + '</span></div>';
      }).join('') + '</div></div></div>';
  }

  function draw() {
    var st = D.load(), an = D.analyze();
    var next = st.cards.filter(function (c) {
      return C.forCard(an, c.id).some(function (r) { return r.l.taught && r.period && r.period.key === D.P2.key; });
    }).length;
    var counts = {};
    st.messages.forEach(function (x) { if (x.to === 'client') counts[x.card_id] = (counts[x.card_id] || 0) + 1; });
    var silent = st.requests.filter(function (r) { return C.isSilent(r, D.TODAY); });
    return '<div class="e-head"><div><span class="e-eyebrow">Система</span><h1>Оповещения</h1>' +
        '<p>Кому, когда и что уходит — без администратора. Текст собирается из журнала: имя, учитель, число уроков ' +
        'и личная ссылка. Администратор узнаёт о расхождении в ту же минуту, когда клиент ответил.</p></div></div>' +
      '<div class="n-rules">' +
        '<div class="n-rule"><span class="when">1 и 16 числа, 10:00</span><b>Клиенту — запрос</b>' +
          '<p>Подтвердить уроки за прошедшие две недели: ссылка, по кнопке на урок, минута времени.</p>' +
          '<div class="ch"><span class="e-tag">WhatsApp</span><span class="e-tag">RU / KZ</span></div></div>' +
        '<div class="n-rule"><span class="when">Через 2 дня тишины</span><b>Клиенту — напоминание</b>' +
          '<p>Одно, вежливое. Если и после него тишина — уроки уходят администратору как «клиент не ответил».</p>' +
          '<div class="ch"><span class="e-tag">WhatsApp</span></div></div>' +
        '<div class="n-rule"><span class="when">Сразу</span><b>Администратору — расхождение</b>' +
          '<p>Спор, «не уверен», оценка 1–2, урок без отметки, подозрительная отметка учителя. С суммой и кнопкой в очередь.</p>' +
          '<div class="ch"><span class="e-tag">Telegram</span></div></div>' +
      '</div>' +
      '<p class="e-small" style="margin:-4px 0 16px">Как подключается: на старте администратор отправляет запросы одной кнопкой — ' +
        'WhatsApp открывается с готовым текстом и личной ссылкой, а расхождения сразу видны в контроле уроков. ' +
        'С WhatsApp Business API школы и Telegram-ботом всё уходит само по этому расписанию.</p>' +
      '<section class="e-card" style="margin-bottom:16px"><div class="e-card-h"><h2>Следующая рассылка</h2><span class="sp"></span>' +
        (silent.length ? '<button class="e-btn sm" id="remindAll">Напомнить молчащим (' + silent.length + ')</button>' : '') +
        '<span class="sub">1 ноября, 10:00 — запросы за ' + C.periodLabel(D.P2, 'ru') + ' уйдут ' +
          E.plural(next, 'клиенту', 'клиентам', 'клиентам') + ', у которых уже есть уроки в журнале.</span></div></section>' +
      '<div class="e-phones">' +
        '<div><p class="n-cap">Телефон клиента<small>что приходит в WhatsApp</small></p>' +
          '<div class="n-pick">' + st.cards.map(function (c) {
            return '<button data-s="' + c.id + '"' + (c.id === S.student ? ' class="on"' : '') + '>' + E.esc(c.name) +
              '<i>' + (counts[c.id] || 0) + '</i></button>';
          }).join('') + '</div>' + whatsapp(st) + '</div>' +
        '<div><p class="n-cap">Телефон администратора<small>бот присылает каждое расхождение</small></p>' +
          '<div class="n-pick" style="visibility:hidden"><button>.</button></div>' + telegram(st) + '</div>' +
      '</div>' +
      '<section class="e-card flush" style="margin-top:18px"><div class="e-card-h"><h2>Журнал событий</h2>' +
        '<span class="sub">Всё, что сделали система, учителя, клиенты и администратор — по времени.</span></div>' +
        '<div class="e-list">' + st.log.slice(0, 14).map(function (x) {
          var who = { system: 'Система', teacher: 'Учитель', client: 'Клиент', admin: 'Администратор' }[x.who] || x.who;
          return '<div class="e-li"><span><b>' + E.esc(who) + '</b> · ' + E.esc(x.text) + '</span><span class="e-small tnum">' +
            E.when(x.at) + '</span></div>';
        }).join('') + '</div></section>';
  }

  draw.wire = function (root) {
    E.on(root, '[data-s]', function (b) { S.student = b.getAttribute('data-s'); go(); });
    E.on(root, '#remindAll', function () {
      var st = D.load();
      st.requests.filter(function (r) { return C.isSilent(r, D.TODAY); }).forEach(function (r) { D.act.remind(r.id); });
      E.toast('Напоминания отправлены');
    });
    ['waFeed', 'tgFeed'].forEach(function (id) { var f = root.querySelector('#' + id); if (f) f.scrollTop = f.scrollHeight; });
  };
  var go = E.mount(document.getElementById('root'), draw);
})();
</script>
</body>
</html>
