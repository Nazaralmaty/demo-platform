<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#135685">
<title>GSC Study · контроль уроков</title>
<link rel="icon" href="../../assets/brand-logo.png">
<link rel="stylesheet" href="../../app/style.css">
<link rel="stylesheet" href="../../app/brand.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="g-wrap" id="root"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="../../app/course.js"></script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var G = window.GSC;

  var root = document.getElementById('root');
  var dlg  = document.getElementById('dlg');
  var dlgBody = document.getElementById('dlgBody');

  var S = { view: 'teacher', client: 's2', log: G.seedLog.slice() };
  var q = location.search;
  if (/view=client/.test(q)) S.view = 'client';
  if (/view=admin/.test(q))  S.view = 'admin';
  if (/student=s\d/.test(q)) S.client = (q.match(/student=(s\d)/) || [])[1] || S.client;

  function say(text) {
    var el = document.getElementById('gToast');
    if (!el) return;
    el.textContent = text; el.style.display = 'block';
    clearTimeout(say._t);
    say._t = setTimeout(function () { el.style.display = 'none'; }, 3200);
  }
  function log(text) {
    S.log.unshift({ at: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), text: text });
  }
  function each(sel, fn) { Array.prototype.forEach.call(root.querySelectorAll(sel), fn); }
  function findLesson(id) {
    var found = null;
    G.students.forEach(function (s) {
      s.lessons.forEach(function (l) { if (l.id === id) { l.student = s; found = l; } });
    });
    return found;
  }
  function byTicket(id) { return G.tickets().filter(function (t) { return t.id === id; })[0]; }

  function render() {
    root.innerHTML =
      '<div class="g-top">' +
        '<img class="g-logo" src="../../assets/brand-logo.png" alt="">' +
        '<h1>Контроль уроков</h1>' +
        '<div class="g-tabs">' +
          '<button data-view="teacher"' + (S.view === 'teacher' ? ' class="on"' : '') + '>Учитель</button>' +
          '<button data-view="client"'  + (S.view === 'client'  ? ' class="on"' : '') + '>Клиент</button>' +
          '<button data-view="admin"'   + (S.view === 'admin'   ? ' class="on"' : '') + '>Администратор</button>' +
        '</div>' +
        '<a class="g-mini" href="demo.html" style="text-decoration:none">К демо</a>' +
      '</div>' +
      '<div id="gToast" class="g-toast"></div>' +
      '<div class="g-note">Один процесс на трёх экранах: <b>учитель</b> ведёт журнал и отмечает уроки, ' +
        '<b>клиент</b> раз в две недели подтверждает их, <b>администратор</b> разбирает расхождения. ' +
        'Зарплата считается от подтверждений: начисленное по отметкам минус спорное.</div>' +

      (S.view === 'teacher' ? viewTeacher()
       : S.view === 'client'  ? viewClient()
       : viewAdmin());

    each('[data-view]', function (b) {
      b.onclick = function () { S.view = b.getAttribute('data-view'); render(); };
    });
    if (S.view === 'teacher') wireTeacher();
    if (S.view === 'client')  wireClient();
    if (S.view === 'admin')   wireAdmin();
  }

  /* ── учитель: единый дашборд школы ─────────────────────────────────
     Все ученики всех учителей — как компания видит индивидуальные
     занятия из одной системы. У каждого свой уровень, старт, ставка,
     период оплаты и темп по курсу. */
  function viewTeacher() {
    var all = G.totals();
    var tk = G.tickets();

    return '<div class="g-kpis">' +
        '<div class="g-kpi"><b>' + G.students.length + '</b><span>учеников</span></div>' +
        '<div class="g-kpi"><b>' + G.money(all.accrued) + '</b><span>начислено по журналу</span></div>' +
        '<div class="g-kpi green"><b>' + G.money(all.confirmed) + '</b><span>подтверждено клиентами</span></div>' +
        '<div class="g-kpi hot"><b>' + G.money(all.hold) + '</b><span>на проверке</span></div>' +
        '<div class="g-kpi hot"><b>' + tk.length + '</b><span>расхождений</span></div>' +
      '</div>' +

      G.students.map(studentCard).join('') +

      '<div class="g-card"><h3>Как это работает</h3>' +
        '<div class="hint" style="margin-bottom:0">' +
          '1. Учитель берёт следующий урок из курса кнопкой «Взять из курса» — тема, слова и задания готовы.<br>' +
          '2. После занятия он ставит отметку «проведён» — она есть основание для зарплаты.<br>' +
          '3. Раз в две недели клиент подтверждает уроки: «прошёл / не прошёл» и качество 1–5.<br>' +
          '4. Подтверждённое уходит в выплату. Спорное, молчание и низкая оценка — на проверку к администратору.' +
        '</div></div>';
  }

  function studentCard(s) {
    var st = G.stat(s);
    var t = G.byTeacher(s.teacher);
    return '<div class="g-card">' +
      '<div class="g-who">' +
        '<span class="ava">' + G.esc(G.initial(s.name)) + '</span>' +
        '<span><b>' + G.esc(s.name) + '</b><span class="ph">' + G.esc(G.phoneFmt(s.phone)) + '</span></span>' +
        '<span class="tags">' +
          '<span class="g-tag">' + G.esc(G.courseBadge(s)) + '</span>' +
          '<span class="g-tag">старт ' + G.dateRu(s.started) + '</span>' +
          '<span class="g-tag">' + G.money(s.rate) + '</span>' +
          '<span class="g-tag g">' + G.esc(s.pay) + '</span>' +
          '<span class="g-tag b">' + G.esc(t.name.split(' ')[0]) + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="g-meta">График: <i>' + G.esc(G.dayNames(s.days)) + ', ' + G.esc(s.time) + '</i>' +
        (s.goal ? ' · цель: <i>' + G.esc(s.goal) + '</i>' : '') + '<br>' +
        'Курс: <i>урок ' + s.nextCourse + ' из 14</i> · начислено <i>' + G.money(st.accrued) +
        '</i>, подтверждено <i>' + G.money(st.confirmed) + '</i>, на проверке <i>' + G.money(st.hold) + '</i></div>' +
      G.periods.map(function (p) {
        var les = s.lessons.filter(function (l) { return l.period === p.id; });
        if (!les.length) return '';
        return '<div style="margin-bottom:8px"><span class="g-tag" style="display:inline-block;margin-bottom:6px">' +
          G.esc(p.label) + (p.closed ? '' : ' · идёт') + '</span>' +
          les.map(function (l) { return lesLine(l); }).join('') + '</div>';
      }).join('') +
      '<div class="g-acts"><button class="g-btn" data-plan="' + s.id + '">Взять следующий урок из курса</button></div>' +
    '</div>';
  }

  function lesLine(l) {
    var pill;
    if (l.resolved === 'paid')         pill = '<span class="g-pill ok">к выплате</span>';
    else if (l.resolved === 'void')   pill = '<span class="g-pill bad">снят</span>';
    else if (l.client === 'no')       pill = '<span class="g-pill bad">клиент: не прошёл</span>';
    else if (l.client === 'yes' && !l.teacherDone) pill = '<span class="g-pill bad">клиент подтвердил, отметки нет</span>';
    else if (l.client === 'yes' && l.quality != null && l.quality <= 2) pill = '<span class="g-pill bad">качество ' + l.quality + '/5</span>';
    else if (l.client === 'yes')      pill = '<span class="g-pill ok">подтверждён</span>';
    else if (G.period(l.period).closed) pill = '<span class="g-pill hold">ждём клиента</span>';
    else                               pill = '<span class="g-pill wait">период не закрыт</span>';

    return '<div class="g-les' + (l.teacherDone ? '' : ' off') + '">' +
      '<input type="checkbox" data-done="' + l.id + '"' + (l.teacherDone ? ' checked' : '') +
        ' title="Урок проведён — отметка учителя">' +
      '<span class="d">' + G.dateRu(l.date) + '</span>' +
      '<span class="tp' + (l.topic ? '' : ' empty') + '" title="' + G.esc(l.homework || '') + '">' +
        G.esc(l.topic || 'тема не задана') + '</span>' + pill +
    '</div>';
  }

  function wireTeacher() {
    each('[data-done]', function (b) {
      b.onchange = function () {
        var l = findLesson(b.getAttribute('data-done'));
        l.teacherDone = b.checked;
        log('Учитель ' + (b.checked ? 'отметил урок' : 'снял отметку') + ': ' + l.student.name + ' · ' + G.dateRu(l.date));
        render();
        say(b.checked ? 'Урок отмечен' : 'Отметка снята');
      };
    });
    each('[data-plan]', function (b) {
      b.onclick = function () { planDialog(G.byId(b.getAttribute('data-plan'))); };
    });
  }

  /* Окно готового урока из курса школы. */
  function planDialog(s) {
    var p = G.plan(s, s.nextCourse);
    if (!p) return;
    open('<h3>' + G.esc(G.courseBadge(s)) + ' · урок ' + p.n + ' из 14</h3>' +
      '<div class="sub">' + G.esc(s.name) + ' · следующий урок курса. Всё ниже уже снято ' +
        'с методички — учителю остаётся провести занятие.</div>' +
      '<div style="font-size:16px;font-weight:800;margin-bottom:2px;font-family:var(--head)">' + G.esc(p.title) + '</div>' +
      '<div style="font-size:13.5px;color:var(--muted);margin-bottom:12px">' + G.esc(p.subtitle) + '</div>' +
      '<div class="g-rule">' + G.esc(p.rule) + '</div>' +
      '<div style="font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase">Слова урока</div>' +
      '<div class="g-words">' + p.words.map(function (w) { return '<span>' + G.esc(w) + '</span>'; }).join('') + '</div>' +
      '<div class="sub" style="margin-bottom:0">В журнал ляжет тема «' + G.esc(p.topic) + '» и домашка из слов и заданий курса.</div>' +
      '<div class="dlg-foot"><button id="no">Закрыть</button>' +
        '<button class="go" id="ok">Взять в журнал</button></div>');
    dlgBody.querySelector('#no').onclick = close;
    dlgBody.querySelector('#ok').onclick = function () {
      var target = s.lessons.filter(function (l) { return !l.teacherDone; })[0];
      if (!target) target = s.lessons[s.lessons.length - 1];
      target.topic = p.topic; target.homework = p.homework; target.courseId = p.id;
      s.nextCourse = Math.min(p.n + 1, 14);
      log('Учитель взял из курса: ' + s.name + ' · урок ' + p.n + ' «' + p.title + '»');
      close(); render(); say('Урок ' + p.n + ' подставлен в журнал');
    };
  }

  /* ── клиент: подтверждение раз в две недели ──────────────────────── */
  function viewClient() {
    var s = G.byId(S.client);
    var p = G.requestFor(s);
    var les = s.lessons.filter(function (l) { return l.period === p.id; });
    var anyAnswer = les.some(function (l) { return l.client !== null; });

    return '<div class="g-card">' +
      '<h3>Что приходит клиенту</h3>' +
      '<div class="hint">Раз в две недели, после закрытия периода. Канал — SMS и WhatsApp, ' +
        'ссылка ведёт на этот же экран.</div>' +
      '<select class="g-field" id="gPick" style="width:auto;min-width:230px;margin-bottom:14px">' +
        G.students.map(function (x) {
          return '<option value="' + x.id + '"' + (x.id === s.id ? ' selected' : '') + '>' +
                 G.esc(x.name) + ' · ' + G.esc(G.courseBadge(x)) + '</option>';
        }).join('') +
      '</select>' +
      '<div class="g-letter"><div class="from">Уведомление · ' + G.esc(p.label) + '</div>' +
        G.esc(G.letter(s, p)) + '</div>' +
      '<h3 style="margin:18px 0 2px">' + G.esc(s.name) + ' · ' + G.esc(p.label) + '</h3>' +
      '<div class="hint">' + (p.closed
        ? 'Период закрыт — администратор ждёт ответа.'
        : 'Период ещё идёт: ответить можно заранее, список пополнится.') + '</div>' +
      les.map(function (l) { return ansLine(l); }).join('') +
      '<textarea class="g-field" id="gNote" placeholder="Комментарий для администратора: что не так, если что-то не так" style="margin-top:12px">' +
        G.esc(s.lessons.filter(function (l) { return l.note; }).map(function (l) { return l.note; }).join(' · ')) +
      '</textarea>' +
      '<div class="g-acts"><button class="g-btn" id="gSend">' +
        (anyAnswer ? 'Обновить ответ' : 'Отправить ответ') + '</button></div>' +
    '</div>' +

    '<div class="g-card"><h3>Правила подтверждения</h3>' +
      '<div class="hint" style="margin-bottom:0">' +
        'Клиент видит только то, что отметил учитель: дату и тему урока. Отвечает «прошёл / не прошёл» ' +
        'и ставит качество от 1 до 5. Подтверждённое уходит учителю в зарплату; спорное и без ответа ' +
        'висит на проверке, пока администратор не разберётся.' +
      '</div></div>';
  }

  function ansLine(l) {
    return '<div class="g-ans">' +
      '<span class="d">' + G.dateRu(l.date) + '</span>' +
      '<span class="tp">' + G.esc(l.topic) + '</span>' +
      '<span class="seg">' +
        '<button data-ans="' + l.id + '" data-v="yes" class="' + (l.client === 'yes' ? 'on' : '') + '">Прошёл</button>' +
        '<button data-ans="' + l.id + '" data-v="no" class="' + (l.client === 'no' ? 'on no' : '') + '">Не прошёл</button>' +
      '</span>' +
      (l.client === 'yes'
        ? '<span class="q">' + [1, 2, 3, 4, 5].map(function (n) {
            return '<button data-q="' + l.id + '" data-n="' + n + '" class="' +
              (l.quality === n ? 'on' + (n <= 2 ? ' low' : '') : '') + '">' + n + '</button>';
          }).join('') + '</span>'
        : '') +
    '</div>';
  }

  function wireClient() {
    var pick = root.querySelector('#gPick');
    if (pick) pick.onchange = function () { S.client = pick.value; render(); };
    each('[data-ans]', function (b) {
      b.onclick = function () {
        var l = findLesson(b.getAttribute('data-ans'));
        l.client = b.getAttribute('data-v');
        if (l.client === 'yes' && !l.quality) l.quality = 5;
        render();
      };
    });
    each('[data-q]', function (b) {
      b.onclick = function () {
        findLesson(b.getAttribute('data-q')).quality = Number(b.getAttribute('data-n'));
        render();
      };
    });
    var send = root.querySelector('#gSend');
    if (send) send.onclick = function () {
      var s = G.byId(S.client), p = G.requestFor(s);
      var note = root.querySelector('#gNote').value.trim();
      var les = s.lessons.filter(function (l) { return l.period === p.id; });
      var ok = les.filter(function (l) { return l.client === 'yes'; }).length;
      var no = les.filter(function (l) { return l.client === 'no'; }).length;
      les.forEach(function (l) { l.note = note || null; });
      log('Клиент ' + s.name + ' ответил за ' + p.label + ': подтвердил ' + ok +
          (no ? ', отверг ' + no : '') + (note ? ', комментарий есть' : ''));
      render();
      say('Ответ отправлен' + (no || note ? '. Администратор разберёт отмеченные уроки' : ''));
    };
  }

  /* ── администратор: единая таблица + очередь ─────────────────────── */
  function viewAdmin() {
    var tk = G.tickets();
    var all = G.totals();

    var rows = G.students.map(function (s) {
      var st = G.stat(s);
      var t = G.byTeacher(s.teacher);
      return '<tr>' +
        '<td><b>' + G.esc(s.name) + '</b><br><span style="color:var(--muted);font-size:12px">' + G.esc(t.name) + '</span></td>' +
        '<td>' + G.esc(G.courseBadge(s)) + '</td>' +
        '<td>' + G.dateRu(s.started) + '</td>' +
        '<td>' + G.esc(s.pay) + ' · ' + G.money(s.rate) + '</td>' +
        '<td class="num">' + st.lessons + '</td>' +
        '<td class="num">' + st.okCount + ' из ' + st.lessons + '</td>' +
        '<td class="num">' + (st.disputes || '—') + '</td>' +
        '<td class="num">' + G.money(st.confirmed) + '</td>' +
        '<td class="num">' + (st.hold ? G.money(st.hold) : '—') + '</td></tr>';
    }).join('');

    return '<div class="g-kpis">' +
        '<div class="g-kpi green"><b>' + G.money(all.confirmed) + '</b><span>подтверждено к выплате</span></div>' +
        '<div class="g-kpi hot"><b>' + G.money(all.hold) + '</b><span>на проверке</span></div>' +
        '<div class="g-kpi hot"><b>' + tk.length + '</b><span>расхождений в очереди</span></div>' +
      '</div>' +

      '<div class="g-card"><h3>Единый дашборд: что делает учитель</h3>' +
        '<div class="hint">Одна строка — один ученик: уровень, старт, период оплаты, ' +
          'сколько уроков в журнале и сколько из них подтверждено клиентом.</div>' +
        '<div class="scrollx"><table><thead><tr>' +
          '<th>Ученик</th><th>Уровень</th><th>Старт</th><th>Оплата</th>' +
          '<th class="num">В журнале</th><th class="num">Подтверждено</th><th class="num">Спор</th>' +
          '<th class="num">К выплате</th><th class="num">На проверке</th>' +
        '</tr></thead><tbody>' + rows + '</tbody>' +
        '<tfoot><tr><td colspan="7">Итого, ' + G.students.length + ' учеников</td>' +
          '<td class="num">' + G.money(all.confirmed) + '</td>' +
          '<td class="num">' + G.money(all.hold) + '</td></tr></tfoot></table></div></div>' +

      '<div class="g-card"><h3>На проверку</h3>' +
        '<div class="hint">Расхождения между журналом учителя и ответом клиента. ' +
          'Пока администратор не разобрался, эти деньги не выплачиваются.</div>' +
        (tk.length ? tk.map(ticketHtml).join('') :
          '<div class="g-empty">Расхождений нет: все закрытые периоды подтверждены клиентами.</div>') +
      '</div>' +

      '<div class="g-card"><h3>Журнал действий</h3>' +
        '<div class="g-log">' + (S.log.length ? S.log.slice(0, 12).map(function (r) {
          return '<div><b>' + r.at + '</b> · ' + G.esc(r.text) + '</div>';
        }).join('') : '<div>Пока пусто</div>') + '</div></div>';
  }

  function ticketHtml(t) {
    var k = G.TICK[t.kind];
    var sum = t.lessons.reduce(function (a, l) { return a + t.student.rate; }, 0);
    var l0 = t.lessons[0];
    var text;
    if (t.kind === 'silent') {
      text = 'За ' + t.period.label + ' учитель отметил ' +
        G.plural(t.lessons.length, 'урок', 'урока', 'уроков') +
        '. Клиент запрос не подтвердил — начисление висит до его ответа.';
    } else if (t.kind === 'dispute') {
      text = G.dateRu(l0.date) + ' · ' + l0.topic + '. Учитель отметил урок проведённым, ' +
        'клиент ответил «не прошёл». Кто прав — решает администратор.';
    } else if (t.kind === 'ghost') {
      text = G.dateRu(l0.date) + ' · ' + l0.topic + '. Клиент подтвердил урок, ' +
        'а в журнале учителя отметки нет — урок не попал в зарплату.';
    } else {
      text = G.dateRu(l0.date) + ' · ' + l0.topic + '. Урок подтверждён, но клиент ' +
        'поставил качество ' + l0.quality + ' из 5' + (l0.note ? ': «' + l0.note + '»' : '') + '.';
    }

    return '<div class="g-tick"><div class="hd">' +
        '<span class="g-pill ' + k.cls + '">' + k.tag + '</span>' +
        '<b>' + G.esc(t.student.name) + ' · ' + G.esc(t.period.label) + '</b>' +
        '<span style="color:var(--muted);font-size:13px">' + G.esc(G.courseBadge(t.student)) + '</span>' +
      '</div>' +
      '<p>' + G.esc(text) + (t.kind === 'silent' ? '' : ' <b style="color:var(--ink)">' + G.money(sum) + '</b>') + '</p>' +
      '<div class="g-acts" style="margin-top:0">' +
        (t.kind === 'silent'
          ? '<button class="g-mini" data-pay="' + t.id + '">Считать по журналу учителя</button>' +
            '<button class="g-mini bad" data-void="' + t.id + '">Снять уроки до ответа клиента</button>'
          : '<button class="g-mini" data-pay="' + t.id + '">' +
              (t.kind === 'ghost' ? 'Зачесть урок' : 'Урок состоялся — к выплате') + '</button>' +
            '<button class="g-mini bad" data-void="' + t.id + '">' +
              (t.kind === 'quality' ? 'Вернуть урок учителю' : 'Урока не было — снять') + '</button>') +
        '<button class="g-mini" data-wc="' + t.id + '">Написать клиенту</button>' +
        '<button class="g-mini" data-wt="' + t.id + '">Написать учителю</button>' +
      '</div></div>';
  }

  function wireAdmin() {
    each('[data-pay]',  function (b) { b.onclick = function () {
      var t = byTicket(b.getAttribute('data-pay'));
      var verb = G.resolve(t, 'paid');
      log(t.student.name + ' · ' + t.period.label + ' — ' + verb + ' (' + t.lessons.length + ' ур.)');
      render(); say('Разобрано: урок к выплате');
    }; });
    each('[data-void]', function (b) { b.onclick = function () {
      var t = byTicket(b.getAttribute('data-void'));
      G.resolve(t, 'void');
      log(t.student.name + ' · ' + t.period.label + ' — начисление снято');
      render(); say('Разобрано: начисление снято');
    }; });
    each('[data-wc]',   function (b) { b.onclick = function () {
      var t = byTicket(b.getAttribute('data-wc'));
      log('Администратор написал клиенту: ' + t.student.name + ' · ' + t.period.label);
      render(); say('Сообщение клиенту отправлено');
    }; });
    each('[data-wt]',   function (b) { b.onclick = function () {
      var t = byTicket(b.getAttribute('data-wt'));
      log('Администратор написал учителю: ' + t.student.name + ' · ' + t.period.label);
      render(); say('Сообщение учителю отправлено');
    }; });
  }

  /* ── окна ────────────────────────────────────────────────────────── */
  function open(html) { dlgBody.innerHTML = html; if (!dlg.open) dlg.showModal(); }
  function close() { dlg.close(); }

  render();
})();
</script>
</body>
</html>
