  <script src="config.js"></script>
  <script src="app/course.js"></script>
  <script src="app/vitrina.js"></script>

  <script src="app/app.js"></script>
  <script>
    /* Кнопка связи: подпись и ссылка пересчитываются при смене языка (route() зовёт syncCta). */
    window.syncCta = function () {
      var a = document.getElementById('cta-link'), B = window.BRAND || {};
      if (!a) return;
      document.getElementById('cta-label').textContent = bt('wantSame');
      if (B.whatsapp || B.instagram) a.href = waHref(); else document.getElementById('cta').style.display = 'none';
    };
    syncCta();
    var secure = location.protocol === 'https:' ||
                 location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if ('serviceWorker' in navigator && secure) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
