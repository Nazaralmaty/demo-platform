<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#135685">
<title>GSC Study · контроль уроков</title>
<link rel="icon" href="assets/brand-logo.png">
<link rel="stylesheet" href="app/style.css">
<link rel="stylesheet" href="app/brand.css">
<link rel="stylesheet" href="app/eco.css">
</head>
<body class="eco">
<main class="e-page" id="root"></main>

<script src="config.js"></script>
<script src="app/course.js"></script>
<script src="app/control.js"></script>
<script src="app/data.js"></script>
<script src="app/eco.js"></script>
<script>
(function () {
  'use strict';
  var C = CTRL, D = DEMO;

  /* Старые ссылки из уведомлений вели сюда с ?view=client&student=s2 —
     теперь у клиента свой экран. */
  var q = location.search, m = /student=(s\d+)/.exec(q);
  if (/view=client/.test(q)) {
    location.replace('confirm.html' + (m ? '?t=gsc-' + m[1] + '-' + D.P1.key : ''));
    return;
  }

  E.shell('control');
  var S = { period: D.P1.key, showDone: false };

  /* Что видно в карточке расхождения: дата, тема, слова клиента,
     подозрения и кнопки, которые решают именно этот случай. */
  var ACTS = {
    dispute: [['paid', 'Урок был — к выплате'], ['void', 'Урока не было — снять'], ['client'], ['teacher']],
    suspect: [['paid', 'Подтверждаю — к выплате'], ['void', 'Снять отметку'], ['teacher'], ['client']],
    ghost:   [['paid', 'Засчитать урок'], ['void', 'Не засчитывать'], ['teacher']],
    unsure:  [['paid', 'Урок был — к выплате'], ['void', 'Не засчитывать'], ['client']],
    lowq:    [['paid', 'Выплатить'], ['void', 'Не выплачивать'], ['teacher']],
    silent:  [['remind'], ['paid', 'Выплатить по журналу'], ['void', 'Не выплачивать']]
  };
  var TONE = { dispute: 'bad', suspect: 'bad', ghost: 'warn', unsure: 'warn', lowq: 'warn', silent: 'warn' };
  var WHY = {
    dispute: 'Учитель отметил урок проведённым, клиент ответил «не было».',
    suspect: 'Отметку никто не подтверждал, и она выглядит необычно.',
    ghost:   'Клиент подтвердил урок по графику, а учитель его не отметил — урок не попал в зарплату.',
    unsure:  'Клиент не уверен, был ли урок.',
    lowq:    'Урок был, но клиент недоволен.',
    silent:  'Запрос ушёл клиенту, ответа нет. Деньги ждут решения.'
  };

  function ticket(t) {
    var r = t.rows[0], l = r.l, teacher = t.teacher || {};
    var lines = t.kind === 'silent'
      ? '<p>' + t.rows.map(function (x) { return E.dayShort(x.date) + ' ' + C.dateLabel(x.date, 'ru'); }).join(' · ') + '</p>'
      : '<p><b>' + E.dayShort(r.date) + ', ' + C.dateLabel(r.date, 'ru') + '</b> · ' + E.esc(l.topic || 'тема не указана') + '</p>';
    var acts = ACTS[t.kind].map(function (a) {
      if (a[0] === 'paid') return '<button class="e-btn sm ok" data-res="' + t.id + '" data-how="paid">' + a[1] + '</button>';
      if (a[0] === 'void') return '<button class="e-btn sm danger" data-res="' + t.id + '" data-how="void">' + a[1] + '</button>';
      if (a[0] === 'remind') return t.request && !t.request.answered_at
        ? '<button class="e-btn sm" data-remind="' + t.request.id + '">Напомнить клиенту</button>' : '';
      return '<button class="e-btn sm sec" data-write="' + t.id + '" data-to="' + a[0] + '">' +
        (a[0] === 'client' ? 'Написать клиенту' : 'Написать учителю') + '</button>';
    }).join('');
    var silentInfo = t.kind === 'silent' && t.request
      ? '<p class="e-small">Запрос ушёл ' + E.when(t.request.sent_at) +
        (t.request.reminded_at ? ', напоминание — ' + E.when(t.request.reminded_at) : '') +
        '. Молчит ' + E.plural(C.diffDays(C.day(t.request.sent_at), D.TODAY), 'день', 'дня', 'дней') + '.</p>'
      : '';
    return '<article class="e-ticket ' + TONE[t.kind] + '">' +
      '<div class="hd"><span class="e-chip ' + TONE[t.kind] + '">' + E.esc(C.KIND[t.kind]) + '</span>' +
        '<span class="sum">' + E.money(t.sum) + '</span></div>' +
      '<div class="nm"><b>' + E.esc(t.card.name) + '</b> учитель ' + E.esc(teacher.name || '—') + ' · ' +
        C.periodLabel(t.period, 'ru') + '</div>' +
      lines +
      (l.client_note && t.kind !== 'silent' ? '<div class="e-quote">«' + E.esc(l.client_note) + '»</div>' : '') +
      (t.kind === 'suspect' ? '<div class="e-tags">' + E.flags(r.flags) + '</div>' : '') +
      (t.kind === 'silent' ? silentInfo : '<p class="e-small">' + WHY[t.kind] + '</p>') +
      '<div class="e-acts">' + acts + '</div>' +
    '</article>';
  }

  function requests(an, p) {
    var st = D.load(), closed = C.isClosed(p, D.TODAY);
    var rows = st.cards.map(function (card) {
      var r = C.requestOf(st, card.id, p.key);
      var mine = C.forCard(an, card.id).filter(function (x) { return x.period && x.period.key === p.key; });
      var taught = mine.filter(function (x) { return x.l.taught; }).length;
      var state;
      if (!r) state = taught ? '<span class="e-chip mute">не отправлен</span>' : '<span class="e-chip mute plain">нет уроков</span>';
      else if (r.answered_at) state = '<span class="e-chip ok">ответил ' + E.when(r.answered_at) + '</span>';
      else if (C.isSilent(r, D.TODAY)) state = '<span class="e-chip warn">молчит ' +
        E.plural(C.diffDays(C.day(r.sent_at), D.TODAY), 'день', 'дня', 'дней') + '</span>';
      else state = '<span class="e-chip wait">отправлен ' + E.when(r.sent_at) + '</span>';
      return '<div class="e-li">' + E.who(card.name, E.plural(taught, 'урок', 'урока', 'уроков') + ' в периоде') + state +
        (r ? '<div class="e-acts">' +
              (!r.answered_at ? '<button class="e-btn sm" data-remind="' + r.id + '">Напомнить</button>' : '') +
              '<button class="e-btn sm sec" data-text="' + r.id + '">Текст сообщения</button>' +
              '<a class="e-btn sm sec" href="confirm.html?t=' + encodeURIComponent(r.token) + '">Как видит клиент →</a></div>'
           : '') + '</div>';
    }).join('');
    var missing = st.cards.filter(function (card) {
      return !C.requestOf(st, card.id, p.key) && C.forCard(an, card.id).some(function (x) {
        return x.l.taught && x.period && x.period.key === p.key;
      });
    }).length;
    return '<section class="e-card flush">' +
      '<div class="e-card-h"><h2>Запросы клиентам</h2><span class="sp"></span>' +
        (missing ? '<button class="e-btn sm" id="send">' + (closed ? 'Отправить запросы' : 'Отправить сейчас') +
          ' (' + missing + ')</button>' : '') +
        '<span class="sub">' + (closed
          ? 'Ушли автоматически ' + C.dateLabel(C.addDays(p.to, 1), 'ru') + ' в 10:00, WhatsApp. Через 2 дня без ответа — напоминание.'
          : 'Период идёт. Запросы уйдут сами ' + C.dateLabel(C.addDays(p.to, 1), 'ru') + ' в 10:00.') + '</span></div>' +
      '<div class="e-list">' + rows + '</div></section>';
  }

  function payroll(an, p) {
    var st = D.load(), list = C.payroll(an, p, st.teachers);
    var tot = { payable: 0, review: 0, awaiting: 0 };
    list.forEach(function (x) { tot.payable += x.money.payable; tot.review += x.money.review; tot.awaiting += x.money.awaiting; });
    return '<section class="e-card flush">' +
      '<div class="e-card-h"><h2>Ведомость · ' + C.periodLabel(p, 'ru') + '</h2><span class="sp"></span>' +
        '<button class="e-btn sm sec" id="print">Печать</button>' +
        '<span class="sub">К выплате — только уроки, подтверждённые клиентом или администратором.</span></div>' +
      '<table class="e-table"><thead><tr><th>Учитель</th><th class="num">К выплате</th><th class="num">На проверке</th>' +
        '<th class="num">Ждёт клиента</th></tr></thead><tbody>' +
      list.map(function (x) {
        return '<tr><td class="lead">' + E.who(x.teacher.name, E.plural(x.money.n.payable, 'урок', 'урока', 'уроков') + ' подтверждено', 't') + '</td>' +
          '<td class="num" data-l="К выплате"><b>' + E.money(x.money.payable) + '</b></td>' +
          '<td class="num" data-l="На проверке">' + (x.money.review ? E.money(x.money.review) : '—') + '</td>' +
          '<td class="num" data-l="Ждёт клиента">' + (x.money.awaiting ? E.money(x.money.awaiting) : '—') + '</td></tr>';
      }).join('') + '</tbody>' +
      '<tfoot><tr><td class="lead">Итого</td><td class="num" data-l="К выплате">' + E.money(tot.payable) + '</td>' +
        '<td class="num" data-l="На проверке">' + E.money(tot.review) + '</td>' +
        '<td class="num" data-l="Ждёт клиента">' + E.money(tot.awaiting) + '</td></tr></tfoot></table></section>';
  }

  function decided(an) {
    var rows = an.rows.filter(function (r) { return r.l.review; })
      .sort(function (a, b) { return String(b.l.review_at || '').localeCompare(String(a.l.review_at || '')); });
    if (!rows.length) return '';
    return '<section class="e-card"><div class="e-card-h"><h2>Решено</h2><span class="e-chip mute plain">' + rows.length + '</span>' +
      '<span class="sp"></span><button class="e-link" id="tgl">' + (S.showDone ? 'Скрыть' : 'Показать') + '</button></div>' +
      (S.showDone ? '<div class="e-tickets">' + rows.map(function (r) {
        return '<div class="e-les" style="grid-template-columns:minmax(0,1fr) auto auto">' +
          '<span class="tp"><b>' + E.esc(r.card.name) + '</b> · ' + C.dateLabel(r.date, 'ru') +
            '<small>' + E.esc(r.l.review_note || r.l.topic || '') + '</small></span>' + E.chip(r.status) +
          '<button class="e-btn sm sec" data-reopen="' + r.l.id + '">Вернуть</button></div>';
      }).join('') + '</div>' : '') + '</section>';
  }

  function draw() {
    var an = D.analyze(), p = C.periodByKey(S.period);
    var mm = C.money(C.forPeriod(an, p));
    var tk = an.tickets;
    var p1 = D.P1, p2 = D.P2;

    return '<div class="e-head"><div><span class="e-eyebrow">Администратор</span><h1>Контроль уроков</h1>' +
        '<p>Учитель отмечает урок — раз в две недели клиент подтверждает его по ссылке — подтверждённое само ' +
        'уходит в зарплату. Всё, где ответы расходятся или отметка выглядит странно, собирается здесь.</p></div>' +
        '<div class="e-seg" role="tablist" aria-label="Период">' + [p1, p2].map(function (x) {
          return '<button role="tab" data-p="' + x.key + '"' + (x.key === S.period ? ' class="on" aria-selected="true"' : '') + '>' +
            C.periodLabel(x, 'ru') + '<small>' + (C.isClosed(x, D.TODAY) ? 'закрыт' : 'идёт') + '</small></button>';
        }).join('') + '</div></div>' +

      '<div class="e-flow">' +
        '<div class="e-kpi navy"><span>Учителя отметили</span><b>' + E.money(mm.claimed) + '</b><small>' +
          E.plural(mm.n.claimed, 'урок', 'урока', 'уроков') + '</small></div>' +
        '<div class="arrow" aria-hidden="true">→</div>' +
        '<div class="e-kpi ok"><span>Подтвердили клиенты</span><b>' + E.money(mm.payable) + '</b><small>к выплате, ' +
          mm.n.payable + ' ур.</small></div>' +
        '<div class="e-kpi"><span>Ждёт ответа</span><b>' + E.money(mm.awaiting) + '</b><small>' + mm.n.awaiting + ' ур., период ' +
          (C.isClosed(p, D.TODAY) ? 'закрыт' : 'идёт') + '</small></div>' +
        '<div class="e-kpi ' + (mm.review ? 'bad' : '') + '"><span>На проверке</span><b>' + E.money(mm.review) + '</b><small>' +
          mm.n.review + ' ур. не выплачиваются</small></div>' +
      '</div>' +

      '<div class="e-grid two">' +
        '<div class="e-stack">' +
          '<section class="e-card"><div class="e-card-h"><h2>Очередь на разбор</h2>' +
            '<span class="e-chip ' + (tk.length ? 'bad' : 'ok') + ' plain">' + tk.length + '</span>' +
            '<span class="sub">Каждое расхождение система нашла сама и сразу написала администратору в Telegram.</span></div>' +
            (tk.length ? '<div class="e-tickets">' + tk.map(ticket).join('') + '</div>'
              : '<div class="e-empty"><b>Всё разобрано</b>Расхождений нет — ведомость можно выплачивать.</div>') +
          '</section>' +
          decided(an) +
        '</div>' +
        '<div class="e-stack">' + requests(an, p) + payroll(an, p) + '</div>' +
      '</div>';
  }

  draw.wire = function (root) {
    E.on(root, '[data-p]', function (b) { S.period = b.getAttribute('data-p'); go(); });
    E.on(root, '[data-res]', function (b) {
      var how = b.getAttribute('data-how');
      var res = D.act.resolve(b.getAttribute('data-res'), how, how === 'paid' ? 'решение администратора' : 'снято администратором');
      E.toast(res === 'ok' ? (how === 'paid' ? 'Урок ушёл в выплату' : 'Начисление снято') : res);
    });
    E.on(root, '[data-remind]', function (b) {
      var res = D.act.remind(b.getAttribute('data-remind'));
      E.toast(res === 'ok' ? 'Напоминание ушло в WhatsApp' : res);
    });
    E.on(root, '[data-write]', function (b) {
      var to = b.getAttribute('data-to');
      var text = D.act.write(b.getAttribute('data-write'), to);
      E.open('<h3>Сообщение ' + (to === 'client' ? 'клиенту' : 'учителю') + ' отправлено</h3>' +
        '<p class="e-small">Текст собрала система — администратору осталось нажать «отправить».</p>' +
        '<div class="e-rule">' + E.esc(text) + '</div>' +
        '<div class="foot"><button class="e-btn" data-close>Понятно</button></div>');
    });
    E.on(root, '[data-text]', function (b) {
      var st = D.load(), r = D.byId(st.requests, b.getAttribute('data-text'));
      var card = D.byId(st.cards, r.card_id);
      E.open('<h3>Запрос · ' + E.esc(card.name) + '</h3>' +
        '<p class="e-small">Так выглядит сообщение в WhatsApp ' + E.esc(E.phoneFmt(card.phone)) + '. Имена, число уроков и ссылку подставляет система.</p>' +
        '<div class="e-label">Русский</div><div class="e-rule">' + E.esc(D.requestText(st, r, 'ru')) + '</div>' +
        '<div class="e-label">Қазақша</div><div class="e-rule">' + E.esc(D.requestText(st, r, 'kk')) + '</div>' +
        '<div class="foot"><a class="e-btn sec" href="notifications.html?student=' + card.id + '">Открыть чат</a>' +
        '<button class="e-btn" data-close>Закрыть</button></div>');
    });
    E.on(root, '[data-reopen]', function (b) { D.act.reopen(b.getAttribute('data-reopen')); E.toast('Вернули в очередь'); });
    E.on(root, '#tgl', function () { S.showDone = !S.showDone; go(); });
    E.on(root, '#send', function () {
      var n = D.act.sendRequests(S.period);
      E.toast('Запросы отправлены: ' + n);
    });
    E.on(root, '#print', function () { window.print(); });
  };

  var go = E.mount(document.getElementById('root'), draw);
})();
</script>
</body>
</html>
